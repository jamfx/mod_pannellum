; Hinweis / Fortschrittsanzeige beim Speichern
MOD_PANNELLUM_GALLERY_SAVE_NOTICE_TITLE="Hinweis zum Speichern"
MOD_PANNELLUM_GALLERY_SAVE_NOTICE_TEXT="Beim Speichern werden für neue oder geänderte Panoramen Vorschaubilder erzeugt. Das kann bei großen Bildern einige Sekunden pro Bild dauern, das Speichern dauert dann entsprechend länger. Erscheint eine Meldung zum Zeitlimit des Servers, klicken Sie einfach erneut auf Speichern – bereits erzeugte Vorschaubilder bleiben erhalten. Empfehlung: Verwenden Sie für die Website Panoramen mit höchstens 8192 × 4096 Pixeln, da größere Bilder auf vielen Smartphones nicht darstellbar sind und lange laden. Bleiben Sie bei etwa 6 bis 12 Panoramen pro Galerie (mehr als etwa 50 Einträge können je nach Server beim Speichern verloren gehen); weitere Panoramen lassen sich in einem zweiten Galerie-Modul auf einer anderen Seite zeigen."
MOD_PANNELLUM_JS_SAVING_TITLE="Vorschaubilder werden erzeugt …"
MOD_PANNELLUM_JS_SAVING_TEXT="Bitte schließen Sie diese Seite nicht. Bei großen Panoramen kann das einen Moment dauern."
