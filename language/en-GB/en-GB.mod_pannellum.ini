; Hinweis / Fortschrittsanzeige beim Speichern
MOD_PANNELLUM_GALLERY_SAVE_NOTICE_TITLE="Note on saving"
MOD_PANNELLUM_GALLERY_SAVE_NOTICE_TEXT="When you save, thumbnails are created for new or changed panoramas. For large images this can take a few seconds per image, so saving will take correspondingly longer. If a message about the server time limit appears, simply click Save again – thumbnails that were already created are kept. Recommendation: use panoramas of at most 8192 × 4096 pixels for the website, as larger images cannot be displayed on many smartphones and load slowly. Keep to about 6 to 12 panoramas per gallery (depending on the server, more than about 50 entries may be lost when saving); further panoramas can be shown in a second gallery module on another page."
MOD_PANNELLUM_JS_SAVING_TITLE="Creating thumbnails …"
MOD_PANNELLUM_JS_SAVING_TEXT="Please do not close this page. This can take a moment for large panoramas."
